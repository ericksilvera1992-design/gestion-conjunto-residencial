<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Lucrier{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1100px; margin: 0 auto; padding: 24px; color: #172033; background: #f6f8fc; }
        header { display:flex; justify-content:space-between; align-items:center; gap:16px; border-bottom:1px solid #dce3f1; padding-bottom:16px; }
        nav { display:flex; flex-wrap:wrap; gap:10px; } nav a { color:#1559c0; text-decoration:none; font-weight:bold; }
        .card, form, table { background:#fff; border-radius:10px; box-shadow:0 2px 10px #dce3f155; padding:20px; }
        .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin:24px 0; }.stat strong{font-size:32px; display:block; color:#1559c0}
        table { width:100%; border-collapse:collapse; padding:0; overflow:hidden; } th,td { padding:12px; text-align:left; border-bottom:1px solid #e5eaf3; } th { background:#edf3ff; }
        form { max-width:700px; } label { display:block; margin-top:12px; font-weight:bold; } input,select,textarea { width:100%; padding:9px; margin-top:5px; box-sizing:border-box; border:1px solid #bdc9dc; border-radius:5px; }
        button,.button { display:inline-block; background:#1559c0; color:white; border:0; border-radius:5px; padding:10px 14px; text-decoration:none; cursor:pointer; margin-top:18px; }.secondary{background:#64748b}.danger{background:#b42318}
        .messages { list-style:none; padding:0; }.messages li { background:#e9f8ef; color:#126634; padding:12px; border-radius:5px; }.errorlist { color:#b42318; margin:5px 0; padding-left:20px; }
        .actions form { display:inline; background:none; box-shadow:none; padding:0; }.actions button{margin:0;padding:7px 10px;} .muted{color:#64748b}
    </style>
</head>
<body>
    <header>
        <div><strong>Lucrier</strong><div class="muted">Gestión residencial</div></div>
        <nav>
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'listar_residentes' %}">Residentes</a>
            <a href="{% url 'vehiculos' %}">Vehículos</a>
            <a href="{% url 'visitas' %}">Visitas</a>
            <a href="{% url 'reservas' %}">Reservas</a>
        </nav>
    </header>
    {% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
    {% block content %}{% endblock %}
</body>
</html>
