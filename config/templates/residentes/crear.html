<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar residente - Lucrier</title>
</head>

<body>

    <header>
        <h1>Lucrier</h1>
        <h2>Registrar residente</h2>
    </header>

    <main>

        <form method="post">

            {% csrf_token %}

            <div>
                <label for="nombres">Nombres:</label>
                <input
                    type="text"
                    id="nombres"
                    name="nombres"
                    value="{{ nombres|default:'' }}"
                    required
                >
            </div>

            <br>

            <div>
                <label for="apellidos">Apellidos:</label>
                <input
                    type="text"
                    id="apellidos"
                    name="apellidos"
                    value="{{ apellidos|default:'' }}"
                    required
                >
            </div>

            <br>

            <div>
                <label for="correo">Correo:</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    value="{{ correo|default:'' }}"
                >
            </div>

            <br>

            <div>
                <label for="telefono">Teléfono:</label>
                <input
                    type="text"
                    id="telefono"
                    name="telefono"
                    value="{{ telefono|default:'' }}"
                    required
                >
            </div>

            <br>

            <div>
                <label for="tipo_residente">
                    Tipo de residente:
                </label>

                <select
                    id="tipo_residente"
                    name="tipo_residente"
                    required
                >
                    <option value="">Seleccione</option>

                    <option
                        value="Propietario"
                        {% if tipo_residente == "Propietario" %}selected{% endif %}
                    >
                        Propietario
                    </option>

                    <option
                        value="Arrendatario"
                        {% if tipo_residente == "Arrendatario" %}selected{% endif %}
                    >
                        Arrendatario
                    </option>

                    <option
                        value="Familiar"
                        {% if tipo_residente == "Familiar" %}selected{% endif %}
                    >
                        Familiar
                    </option>
                </select>
            </div>

            <br>

            <div>
                <label for="titular">¿Es titular?</label>

                <select
                    id="titular"
                    name="titular"
                    required
                >
                    <option value="">Seleccione</option>

                    <option
                        value="SI"
                        {% if titular == "SI" %}selected{% endif %}
                    >
                        Sí
                    </option>

                    <option
                        value="NO"
                        {% if titular == "NO" %}selected{% endif %}
                    >
                        No
                    </option>
                </select>
            </div>

            <br>

            <div>
                <label for="documento">Documento:</label>

                <input
                    type="text"
                    id="documento"
                    name="documento"
                    value="{{ documento|default:'' }}"
                    required
                >

                {% if error %}
                    <p>
                        <strong>Error:</strong> {{ error }}
                    </p>
                {% endif %}
            </div>

            <br>

            <div>
                <label for="id_vivienda">
                    Vivienda:
                </label>

                <select
                    id="id_vivienda"
                    name="id_vivienda"
                    required
                >
                    <option value="">
                        Seleccione una vivienda
                    </option>

                    {% for vivienda in viviendas %}
                        <option
                            value="{{ vivienda.id_vivienda }}"
                            {% if vivienda.id_vivienda|stringformat:"s" == id_vivienda %}selected{% endif %}
                        >
                            {{ vivienda.codigo_vivienda }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <br>

            <button type="submit">
                Registrar residente
            </button>

        </form>

        <br>

        <a href="{% url 'listar_residentes' %}">
            Volver al listado
        </a>

    </main>

</body>

</html>
